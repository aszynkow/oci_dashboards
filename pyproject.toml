[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-dashboards"
version = "0.1.0"
description = "Python tooling for OCI dashboards"
requires-python = ">=3.10"
dependencies = ["oci>=2.190,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]

oci-backup-health-deploy = "oci_dashboards.deploy:main"
